{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">

<i class="fa-solid fa-book"></i>

Tutorial Library

</h2>

<form method="GET" class="row mb-4">

<div class="col-md-8">

<input
type="text"
name="search"
class="form-control search-box"
placeholder="Search tutorial...">

</div>

<div class="col-md-4">

<button class="btn btn-primary w-100">

Search

</button>

</div>

</form>

<div class="row">

{% for tutorial in tutorials %}

<div class="col-lg-4 col-md-6 mb-4">

<div class="card h-100">

{% if tutorial.thumbnail %}

<img src="{{ tutorial.thumbnail.url }}">

{% endif %}

<div class="card-body">

<span class="badge bg-success">

{{ tutorial.level }}

</span>

<h4 class="mt-3">

{{ tutorial.title }}

</h4>

<p>

{{ tutorial.short_description }}

</p>

<a
href="{{ tutorial.get_absolute_url }}"
class="btn btn-primary">

Read More

</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
