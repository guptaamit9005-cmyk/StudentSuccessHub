
{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-red">

                <h3>

                    ✍ Let's Create the  Discussion

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                    </div>

                    <div class="mb-3">

                        <label>

                            Category

                        </label>

                        {{ form.category }}

                    </div>

                    <div class="mb-3">

                        <label>

                            Content

                        </label>

                        {{ form.content }}

                    </div>

                    <button
                        class="btn btn-primary">

                        Post the discussion

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
