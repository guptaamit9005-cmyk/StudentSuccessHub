{% extends 'base.html' %}

{% block content %}
<h1>Delete Student</h1>
<p>Are you sure you want to delete {{ student.first_name }} {{ student.last_name }} ({{ student.roll_number }})?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, I want to Delete </button>
    <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
