{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="display-4 fw-bold">
            🧪 Lab Resources
        </h1>

        <p class="text-muted">
            Access all programming lab questions and solutions
        </p>

    </div>

    <div class="row">

        {% for subject in subjects %}

        <div class="col-md-4 mb-4">

            <div class="card shadow-lg h-100 border-0">

                <div class="card-body">

                    <h3>
                        {{ subject.name }}
                    </h3>

                    <p class="text-muted">

                        {{ subject.description }}

                    </p>

                    <a
                        href="{% url 'lab_questions' subject.id %}"
                        class="btn btn-primary">

                        Open Lab

                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="alert alert-info">

            No Lab Subjects Available

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
